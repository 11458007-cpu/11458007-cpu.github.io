<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聊天對話窗 - ntfy.sh</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 800px;
            height: 600px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-bottom: 1px solid #e0e0e0;
        }

        .header-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .header-controls {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .control-group {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        input[type="text"] {
            padding: 8px 12px;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            min-width: 150px;
        }

        button {
            padding: 8px 16px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: background 0.3s;
        }

        button:hover {
            background: #45a049;
        }

        button:disabled {
            background: #cccccc;
            cursor: not-allowed;
        }

        .status {
            padding: 8px 14px;
            background: #ff5252;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            white-space: nowrap;
        }

        .status.connected {
            background: #4CAF50;
        }

        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: #f5f5f5;
        }

        .message {
            display: flex;
            margin-bottom: 10px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.sent {
            justify-content: flex-end;
        }

        .message.received {
            justify-content: flex-start;
        }

        .message-bubble {
            max-width: 60%;
            padding: 12px 16px;
            border-radius: 15px;
            word-wrap: break-word;
            font-size: 14px;
        }

        .message.sent .message-bubble {
            background: #667eea;
            color: white;
            border-bottom-right-radius: 5px;
        }

        .message.received .message-bubble {
            background: #e0e0e0;
            color: #333;
            border-bottom-left-radius: 5px;
        }

        .message-user {
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 4px;
            padding: 0 4px;
        }

        .message.sent .message-user {
            text-align: right;
            color: #667eea;
        }

        .message.received .message-user {
            text-align: left;
            color: #666;
        }

        .input-area {
            padding: 15px;
            background: white;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
        }

        .input-area input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }

        .input-area button {
            padding: 12px 20px;
            min-width: 80px;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            color: #999;
            text-align: center;
        }

        .empty-state p {
            font-size: 16px;
            margin-bottom: 10px;
        }

        .scroll-to-bottom {
            margin-top: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-title">💬 聊天對話窗</div>
            <div class="header-controls">
                <div class="control-group">
                    <label for="topic" style="font-size: 14px;">頻道：</label>
                    <input type="text" id="topic" value="drher-lele" placeholder="輸入頻道名稱">
                </div>
                <button id="connectBtn" onclick="toggleConnection()">連線 / 訂閱</button>
                <div class="status" id="status">未連線</div>
            </div>
        </div>

        <div class="chat-area" id="chatArea">
            <div class="empty-state">
                <p>🔗 點擊「連線 / 訂閱」開始聊天</p>
            </div>
        </div>

        <div class="input-area">
            <input type="text" id="messageInput" placeholder="輸入訊息，按 Enter 送出..." disabled>
            <button id="sendBtn" onclick="sendMessage()" disabled>送出</button>
        </div>
    </div>

    <script>
        const NTFY_URL = 'https://ntfy.sh';
        const USERNAME = '樂樂';
        
        let eventSource = null;
        let isConnected = false;
        let currentTopic = '';

        const topicInput = document.getElementById('topic');
        const connectBtn = document.getElementById('connectBtn');
        const sendBtn = document.getElementById('sendBtn');
        const messageInput = document.getElementById('messageInput');
        const chatArea = document.getElementById('chatArea');
        const statusDiv = document.getElementById('status');

        // 連線/訂閱切換
        function toggleConnection() {
            if (isConnected) {
                disconnect();
            } else {
                connect();
            }
        }

        // 連線
        function connect() {
            const topic = topicInput.value.trim();
            if (!topic) {
                alert('請輸入頻道名稱');
                return;
            }

            currentTopic = topic;
            isConnected = true;
            topicInput.disabled = true;
            connectBtn.textContent = '斷開連線';
            messageInput.disabled = false;
            sendBtn.disabled = false;
            statusDiv.textContent = '已連線';
            statusDiv.classList.add('connected');
            
            // 清空聊天區域
            chatArea.innerHTML = '';

            // 訂閱頻道 - 使用 EventSource
            const eventSourceUrl = `${NTFY_URL}/${topic}/json`;
            eventSource = new EventSource(eventSourceUrl);

            eventSource.onmessage = function(event) {
                const data = JSON.parse(event.data);
                if (data.message) {
                    const username = data.title || '未知使用者';
                    addMessage(data.message, 'received', username);
                }
            };

            eventSource.onerror = function(error) {
                console.error('連線錯誤:', error);
                statusDiv.textContent = '連線錯誤';
                statusDiv.classList.remove('connected');
            };
        }

        // 斷開連線
        function disconnect() {
            if (eventSource) {
                eventSource.close();
                eventSource = null;
            }
            isConnected = false;
            topicInput.disabled = false;
            connectBtn.textContent = '連線 / 訂閱';
            messageInput.disabled = true;
            sendBtn.disabled = true;
            messageInput.value = '';
            statusDiv.textContent = '未連線';
            statusDiv.classList.remove('connected');
            currentTopic = '';
        }

        // 發送訊息
        async function sendMessage() {
            const message = messageInput.value.trim();
            if (!message || !isConnected) {
                return;
            }

            const fullMessage = `${USERNAME}: ${message}`;

            try {
                // 發送到 ntfy.sh
                const response = await fetch(`${NTFY_URL}/${currentTopic}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'text/plain',
                    },
                    body: fullMessage
                });

                if (response.ok) {
                    // 在聊天窗顯示
                    addMessage(message, 'sent', USERNAME);
                    messageInput.value = '';
                    messageInput.focus();
                } else {
                    alert('訊息送出失敗');
                }
            } catch (error) {
                console.error('發送錯誤:', error);
                alert('發送錯誤: ' + error.message);
            }
        }

        // 添加訊息到聊天區域
        function addMessage(text, type, username) {
            // 移除空狀態
            const emptyState = chatArea.querySelector('.empty-state');
            if (emptyState) {
                emptyState.remove();
            }

            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;

            const userDiv = document.createElement('div');
            userDiv.className = 'message-user';
            userDiv.textContent = username;

            const bubbleDiv = document.createElement('div');
            bubbleDiv.className = 'message-bubble';
            bubbleDiv.textContent = text;

            messageDiv.appendChild(userDiv);
            messageDiv.appendChild(bubbleDiv);
            chatArea.appendChild(messageDiv);

            // 自動滾動到底部
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        // Enter 鍵送出訊息
        messageInput.addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                sendMessage();
            }
        });

        // 頁面載入時設定初始狀態
        window.addEventListener('load', function() {
            messageInput.focus();
        });
    </script>
</body>
</html>
